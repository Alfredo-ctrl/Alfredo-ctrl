<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Alfredo Ramos - AI &amp; Computer Vision Engineer</title>
  <desc id="desc">High-tech portfolio banner with neural network graph, edge AI code, computer vision bounding boxes, and professional typography.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="45%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#110d29"/>
    </linearGradient>

    <!-- Accent Linear Gradient -->
    <linearGradient id="accentGrad" x1="120" y1="100" x2="1100" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="80%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glowing Radial Core -->
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 220) rotate(90) scale(200 280)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#C084FC" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 80) rotate(90) scale(140 220)">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.22 0 0 0 0 0.74 0 0 0 0 0.97 0 0 0 0.6 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Tech Grid -->
    <pattern id="techGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" stroke="#1E293B" stroke-opacity="0.32" stroke-width="1"/>
      <circle cx="48" cy="48" r="1" fill="#38BDF8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="440" rx="28" fill="url(#bgGrad)"/>
  <rect width="1280" height="440" rx="28" fill="url(#techGrid)"/>
  <rect width="1280" height="440" rx="28" fill="url(#leftGlow)"/>
  <rect width="1280" height="440" rx="28" fill="url(#coreGlow)"/>

  <!-- Outer Neon Border -->
  <rect x="2" y="2" width="1276" height="436" rx="26" stroke="url(#accentGrad)" stroke-opacity="0.45" stroke-width="1.8"/>

  <!-- Left Code Window (Terminal Snippet) -->
  <g transform="translate(68, 56)">
    <!-- Terminal Box -->
    <rect width="360" height="152" rx="14" fill="#0B132B" fill-opacity="0.82" stroke="#1E293B" stroke-width="1.2"/>
    <!-- Terminal Header Buttons -->
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" opacity="0.85"/>
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B" opacity="0.85"/>
    <circle cx="52" cy="18" r="4.5" fill="#10B981" opacity="0.85"/>
    <text x="76" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#64748B" font-weight="600">pipeline_vision.py</text>
    
    <!-- Code Lines -->
    <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="500">
      <text x="20" y="52" fill="#F472B6">from</text>
      <text x="60" y="52" fill="#E2E8F0">vision_edge</text>
      <text x="148" y="52" fill="#F472B6">import</text>
      <text x="200" y="52" fill="#38BDF8">Hailo8L, MobileNetV2</text>

      <text x="20" y="76" fill="#38BDF8">detector</text>
      <text x="84" y="76" fill="#94A3B8">=</text>
      <text x="100" y="76" fill="#818CF8">IndustrialInspector</text>
      <text x="245" y="76" fill="#E2E8F0">(model=</text>
      <text x="296" y="76" fill="#A78BFA">"v2"</text>
      <text x="328" y="76" fill="#E2E8F0">)</text>

      <text x="20" y="100" fill="#38BDF8">metrics</text>
      <text x="78" y="100" fill="#94A3B8">=</text>
      <text x="94" y="100" fill="#E2E8F0">detector.</text>
      <text x="162" y="100" fill="#34D399">evaluate</text>
      <text x="228" y="100" fill="#E2E8F0">(recall=</text>
      <text x="286" y="100" fill="#F59E0B">0.99</text>
      <text x="320" y="100" fill="#E2E8F0">)</text>

      <text x="20" y="126" fill="#10B981">✓ Status: Ready for Production Deploy</text>
    </g>
  </g>

  <!-- Right Neural / Computer Vision Interactive Mesh -->
  <g transform="translate(820, 48)">
    <!-- Simulated Bounding Box for Inspection -->
    <rect x="70" y="30" width="310" height="230" rx="16" fill="#0B132B" fill-opacity="0.55" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="70" y="30" width="124" height="24" rx="4" fill="#38BDF8"/>
    <text x="78" y="46" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#030712">DEFECT_CONF: 99.4%</text>

    <!-- Corner Target Reticles -->
    <path d="M 60 45 L 60 20 L 85 20" stroke="#818CF8" stroke-width="2.5" fill="none"/>
    <path d="M 390 45 L 390 20 L 365 20" stroke="#818CF8" stroke-width="2.5" fill="none"/>
    <path d="M 60 245 L 60 270 L 85 270" stroke="#818CF8" stroke-width="2.5" fill="none"/>
    <path d="M 390 245 L 390 270 L 365 270" stroke="#818CF8" stroke-width="2.5" fill="none"/>

    <!-- Neural Network Graph Nodes and Synapses -->
    <g filter="url(#glowEffect)">
      <!-- Synaptic Connections -->
      <line x1="130" y1="90" x2="220" y2="120" stroke="#38BDF8" stroke-width="2" opacity="0.75"/>
      <line x1="130" y1="170" x2="220" y2="120" stroke="#818CF8" stroke-width="2" opacity="0.75"/>
      <line x1="130" y1="170" x2="220" y2="200" stroke="#38BDF8" stroke-width="2" opacity="0.75"/>
      <line x1="220" y1="120" x2="310" y2="150" stroke="#C084FC" stroke-width="2" opacity="0.85"/>
      <line x1="220" y1="200" x2="310" y2="150" stroke="#F472B6" stroke-width="2" opacity="0.85"/>
      <line x1="220" y1="120" x2="310" y2="90" stroke="#38BDF8" stroke-width="1.8" opacity="0.6"/>
      <line x1="220" y1="200" x2="310" y2="210" stroke="#818CF8" stroke-width="1.8" opacity="0.6"/>

      <!-- Synapse Nodes -->
      <circle cx="130" cy="90" r="7" fill="#38BDF8"/>
      <circle cx="130" cy="170" r="7" fill="#818CF8"/>
      <circle cx="220" cy="120" r="9" fill="#C084FC"/>
      <circle cx="220" cy="200" r="8" fill="#38BDF8"/>
      <circle cx="310" cy="90" r="6" fill="#818CF8"/>
      <circle cx="310" cy="150" r="10" fill="#34D399"/>
      <circle cx="310" cy="210" r="6" fill="#F472B6"/>
    </g>

    <text x="145" y="292" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94A3B8" letter-spacing="1">GRAD-CAM ACTIVATION MAP</text>
  </g>

  <!-- Status Capsule Badge -->
  <g transform="translate(68, 236)">
    <rect width="365" height="34" rx="17" fill="#0F172A" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="20" cy="17" r="5.5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="23" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#E0F2FE" letter-spacing="0.8">OPEN TO COLLABS &amp; ROLES • NUEVO LEÓN, MX</text>
  </g>

  <!-- Main Headline Typography -->
  <text x="68" y="322" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#F8FAFC" letter-spacing="-1">
    Alfredo Ramos
  </text>
  
  <text x="68" y="362" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" font-weight="700" fill="url(#textGrad)" letter-spacing="0.5">
    &lt; AI &amp; COMPUTER VISION ENGINEER /&gt;
  </text>

  <!-- Stack Pills / Subtitle -->
  <text x="68" y="398" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">
    Deep Learning • Computer Vision • Edge AI (Raspberry Pi 5 + Hailo-8L) • MobileNetV2 • PyTorch • FastAPI • Three.js
  </text>
</svg>
