<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Alfredo Ramos — Artificial Intelligence and Computer Vision Engineer</title>
  <desc id="desc">Architectural engineering specification banner for Alfredo Ramos, specializing in Deep Learning, Computer Vision, Edge NPU Inference, and Interactive Web Systems.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05080F"/>
      <stop offset="55%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#0D1425"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="swissGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#1E293B" stroke-opacity="0.38" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="360" rx="10" fill="url(#bgGrad)"/>
  <rect width="1280" height="360" rx="10" fill="url(#swissGrid)"/>
  <rect x="1" y="1" width="1278" height="358" rx="9" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Telemetry Header Bar -->
  <rect x="2" y="2" width="1276" height="44" rx="8" fill="#060A12" fill-opacity="0.85"/>
  <line x1="0" y1="46" x2="1280" y2="46" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="0" y1="46" x2="540" y2="46" stroke="url(#accentLine)" stroke-width="1.5"/>

  <text x="44" y="28" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">ARCH.SPEC // ALFREDO-CTRL</text>
  <text x="340" y="28" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#475569" letter-spacing="1.2">FOCUS // DEEP LEARNING · COMPUTER VISION · EDGE NPU · WEB SYSTEMS</text>
  <circle cx="1054" cy="24" r="3.5" fill="#10B981"/>
  <text x="1236" y="28" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.2">NUEVO LEON, MX // ACTIVE</text>

  <!-- Left Architectural Identity Block -->
  <g transform="translate(44, 92)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="2.2">ARTIFICIAL INTELLIGENCE &amp; SYSTEMS ENGINEERING</text>
    
    <text x="0" y="54" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC" letter-spacing="-1.2">Alfredo Ramos</text>
    
    <text x="0" y="92" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">Designing convolutional vision pipelines, edge-quantized neural architectures,</text>
    <text x="0" y="116" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">explainable AI diagnostics, and high-reliability production software.</text>

    <!-- Bottom 4-Metric Specification Row -->
    <g transform="translate(0, 146)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="180" height="72" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="56" y2="0" stroke="#38BDF8" stroke-width="2"/>
      <text x="16" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">QUALITY CONTROL</text>
      <text x="16" y="47" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" font-weight="800" fill="#F8FAFC">99.72% Acc</text>
      <text x="16" y="62" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#38BDF8">MobileNetV2 Fine-Tuned</text>

      <!-- Card 2 -->
      <rect x="192" y="0" width="180" height="72" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1.2"/>
      <line x1="192" y1="0" x2="248" y2="0" stroke="#10B981" stroke-width="2"/>
      <text x="208" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">RETAIL ENSEMBLE</text>
      <text x="208" y="47" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" font-weight="800" fill="#F8FAFC">98.50% mAP</text>
      <text x="208" y="62" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#10B981">YOLO11 + RT-DETR WBF</text>

      <!-- Card 3 -->
      <rect x="384" y="0" width="180" height="72" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1.2"/>
      <line x1="384" y1="0" x2="440" y2="0" stroke="#818CF8" stroke-width="2"/>
      <text x="400" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">EDGE HARDWARE</text>
      <text x="400" y="47" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" font-weight="800" fill="#F8FAFC">13 TOPS NPU</text>
      <text x="400" y="62" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#818CF8">RPi 5 + Hailo-8L INT8</text>

      <!-- Card 4 -->
      <rect x="576" y="0" width="180" height="72" rx="6" fill="#0B1120" stroke="#1E293B" stroke-width="1.2"/>
      <line x1="576" y1="0" x2="632" y2="0" stroke="#38BDF8" stroke-width="2"/>
      <text x="592" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">RISK MODELING</text>
      <text x="592" y="47" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" font-weight="800" fill="#F8FAFC">0.809 AUC</text>
      <text x="592" y="62" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#94A3B8">Stratified 5-Fold CV</text>
    </g>
  </g>

  <!-- Right Column: Architectural Stack Schematic -->
  <g transform="translate(836, 74)">
    <rect width="400" height="248" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Panel Header -->
    <rect x="1" y="1" width="398" height="36" rx="7" fill="#0F172A"/>
    <line x1="0" y1="37" x2="400" y2="37" stroke="#1E293B" stroke-width="1"/>
    <text x="18" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1.4">SYSTEMS ARCHITECTURE LAYERS</text>
    <text x="382" y="23" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#38BDF8">4 TIERS</text>

    <!-- Layer 01 -->
    <g transform="translate(18, 50)">
      <rect width="364" height="40" rx="5" fill="#060A12" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="17" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#38BDF8" letter-spacing="1">L1 // NEURAL BACKBONES &amp; VISION</text>
      <text x="14" y="32" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">PyTorch · TensorFlow · Keras 3 · OpenCV · YOLO11</text>
    </g>

    <!-- Layer 02 -->
    <g transform="translate(18, 98)">
      <rect width="364" height="40" rx="5" fill="#060A12" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="17" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#818CF8" letter-spacing="1">L2 // EXPLAINABILITY &amp; STATISTICAL ML</text>
      <text x="14" y="32" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">Grad-CAM · Scikit-Learn · WBF · PCA · K-Means</text>
    </g>

    <!-- Layer 03 -->
    <g transform="translate(18, 146)">
      <rect width="364" height="40" rx="5" fill="#060A12" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="17" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#10B981" letter-spacing="1">L3 // INFERENCE &amp; EDGE ACCELERATION</text>
      <text x="14" y="32" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">FastAPI · Hailo-8L NPU · RPi 5 · Docker · Linux</text>
    </g>

    <!-- Layer 04 -->
    <g transform="translate(18, 194)">
      <rect width="364" height="40" rx="5" fill="#060A12" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="17" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="1">L4 // SPATIAL WEB &amp; DEVELOPER TOOLING</text>
      <text x="14" y="32" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#E2E8F0">Three.js · WebGL · TypeScript · Node.js · CLI</text>
    </g>
  </g>
</svg>
