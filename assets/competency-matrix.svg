<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Technical Competency and Stack Architecture Matrix</title>
  <desc id="desc">Four-column architectural specification of Deep Learning, Machine Learning, Edge Hardware, and Spatial Web stacks.</desc>

  <rect width="1280" height="320" rx="10" fill="#090E1A" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header Bar -->
  <rect x="1" y="1" width="1278" height="44" rx="9" fill="#060A12"/>
  <line x1="0" y1="45" x2="1280" y2="45" stroke="#1E293B" stroke-width="1.5"/>
  <text x="28" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.5">TECHNICAL COMPETENCY MATRIX // CORE ENGINEERING STACK</text>
  <text x="1252" y="28" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#38BDF8" letter-spacing="1">SPECIFICATION v2.4</text>

  <!-- Vertical Dividers -->
  <line x1="320" y1="45" x2="320" y2="320" stroke="#1E293B" stroke-width="1"/>
  <line x1="640" y1="45" x2="640" y2="320" stroke="#1E293B" stroke-width="1"/>
  <line x1="960" y1="45" x2="960" y2="320" stroke="#1E293B" stroke-width="1"/>

  <!-- COLUMN 01: DEEP LEARNING & VISION -->
  <g transform="translate(28, 76)">
    <text x="0" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.2">01 // COMPUTER VISION &amp; DL</text>
    
    <text x="0" y="34" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">FRAMEWORKS &amp; TENSORS</text>
    <text x="0" y="54" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#F8FAFC">PyTorch · TensorFlow 2.x</text>
    <text x="0" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#F8FAFC">Keras 3 · OpenCV · Pillow</text>

    <text x="0" y="108" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">NEURAL ARCHITECTURES</text>
    <text x="0" y="128" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#CBD5E1">YOLO11x/s · RT-DETR · RF-DETR</text>
    <text x="0" y="146" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#CBD5E1">MobileNetV2 · ResNet-18/50</text>
    <text x="0" y="164" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#CBD5E1">VGG19 · RetinaNet FPN</text>

    <text x="0" y="198" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">METHODS</text>
    <text x="0" y="216" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#94A3B8">Grad-CAM XAI · WBF Fusion</text>
  </g>

  <!-- COLUMN 02: STATISTICAL ML & DATA -->
  <g transform="translate(348, 76)">
    <text x="0" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#818CF8" letter-spacing="1.2">02 // MACHINE LEARNING &amp; DATA</text>
    
    <text x="0" y="34" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">LIBRARIES</text>
    <text x="0" y="54" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#F8FAFC">Scikit-Learn · NumPy</text>
    <text x="0" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#F8FAFC">Pandas · Matplotlib · Seaborn</text>

    <text x="0" y="108" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">ESTIMATORS &amp; CLUSTERING</text>
    <text x="0" y="128" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#CBD5E1">Random Forest · SVM (RBF)</text>
    <text x="0" y="146" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#CBD5E1">Logistic Regression · Trees</text>
    <text x="0" y="164" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#CBD5E1">K-Means · 2D/3D PCA</text>

    <text x="0" y="198" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">VALIDATION</text>
    <text x="0" y="216" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#94A3B8">Stratified K-Fold · GridSearch</text>
  </g>

  <!-- COLUMN 03: EDGE AI, BACKEND & INFRA -->
  <g transform="translate(668, 76)">
    <text x="0" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1.2">03 // EDGE NPU &amp; BACKEND</text>
    
    <text x="0" y="34" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">EDGE ACCELERATION</text>
    <text x="0" y="54" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#F8FAFC">Raspberry Pi 5 · Hailo-8L NPU</text>
    <text x="0" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#F8FAFC">INT8 Quantization (13 TOPS)</text>

    <text x="0" y="108" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">APIS &amp; SERVICES</text>
    <text x="0" y="128" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#CBD5E1">Python · FastAPI · Uvicorn</text>
    <text x="0" y="146" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#CBD5E1">Node.js · Express · Streamlit</text>
    <text x="0" y="164" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#CBD5E1">Gradio · RESTful Pipelines</text>

    <text x="0" y="198" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">INFRASTRUCTURE</text>
    <text x="0" y="216" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#94A3B8">Docker · Linux · Git · CI/CD</text>
  </g>

  <!-- COLUMN 04: SPATIAL WEB & TOOLING -->
  <g transform="translate(988, 76)">
    <text x="0" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#F8FAFC" letter-spacing="1.2">04 // SPATIAL WEB &amp; CLI</text>
    
    <text x="0" y="34" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">WEB &amp; GRAPHICS</text>
    <text x="0" y="54" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#F8FAFC">JavaScript (ES6+) · TypeScript</text>
    <text x="0" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#F8FAFC">Three.js · WebGL · HTML5 Canvas</text>

    <text x="0" y="108" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">INTERFACE ENGINEERING</text>
    <text x="0" y="128" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#CBD5E1">React · Tailwind CSS · CSS3</text>
    <text x="0" y="146" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#CBD5E1">GSAP Motion · 3D Digital Twins</text>
    <text x="0" y="164" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#CBD5E1">Playwright E2E Verification</text>

    <text x="0" y="198" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B">SECURITY &amp; CLI</text>
    <text x="0" y="216" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#94A3B8">Prompt Auditing · Repo Hygiene</text>
  </g>
</svg>
